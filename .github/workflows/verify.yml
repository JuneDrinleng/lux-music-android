name: Verify
on:
  pull_request:
    branches: [main, dev, codex/roadmap]
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  required-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Gradle wrapper
        run: python3 scripts/verify_wrapper.py
      - name: Build policy tests
        run: ./gradlew -p build-logic test validatePlugins --console=plain
      - name: Verify architecture, quality and APK
        run: ./gradlew verify --console=plain
      - name: Architecture negative cases
        run: python3 scripts/test_architecture.py
      - name: Verify APK metadata
        run: python3 scripts/verify_apk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stage-1-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**
