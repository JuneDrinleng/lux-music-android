name: Verify
on:
  pull_request:
    branches: [main, dev, codex/roadmap, codex/stage-1-foundation, codex/stage-2-lx-protocol, codex/stage-3-source-runtime]
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LUX_LX_SOURCE: ${{ github.workspace }}/.contract-upstream/lx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Checkout pinned LX protocol oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyswhut/lx-music-sync-server
          ref: d47aca4284a7c4d9ef755df1f44fb0b0a5b2af36
          path: .contract-upstream/lx
          persist-credentials: false
      - name: Verify published message2call and golden fixtures
        run: |
          python3 scripts/lx-contract/prepare.py
          node --experimental-vm-modules scripts/lx-contract/generate.mjs --check
      - name: Build pinned original LX integration deployment
        run: python3 scripts/lx-contract/prepare_server.py
      - name: Install pinned Android SDK
        run: python3 scripts/setup_android_ci.py
      - name: Verify Gradle wrapper
        run: python3 scripts/verify_wrapper.py
      - name: Build policy tests
        run: ./gradlew -p build-logic test validatePlugins --console=plain
      - name: Verify architecture, quality and APK
        run: ./gradlew verify --console=plain
      - name: Architecture negative cases
        run: python3 scripts/test_architecture.py
      - name: Verify APK metadata
        run: |
          python3 scripts/verify_apk.py
          python3 scripts/test_verify_native.py
          python3 scripts/verify_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**
  source-runtime-devices:
    env:
      LUX_LX_SOURCE: ${{ github.workspace }}/.contract-upstream/lx
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '33'
            image: default
            page-size: '4096'
            revision: '2'
          - api: '36'
            image: google_apis_ps16k
            page-size: '16384'
            revision: '7'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Checkout pinned LX integration server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyswhut/lx-music-sync-server
          ref: d47aca4284a7c4d9ef755df1f44fb0b0a5b2af36
          path: .contract-upstream/lx
          persist-credentials: false
      - name: Build pinned original LX integration deployment
        run: python3 scripts/lx-contract/prepare_server.py
      - name: Install pinned Android SDK
        run: python3 scripts/setup_android_ci.py
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run actual isolated QuickJS device tests
        run: python3 scripts/test_source_device.py '${{ matrix.api }}' '${{ matrix.image }}' '${{ matrix.page-size }}' '${{ matrix.revision }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quickjs-api${{ matrix.api }}-${{ matrix.page-size }}-${{ github.sha }}
          retention-days: 7
          path: |
            source-runtime/build/device-evidence/**
            source-runtime/build/reports/**
            source-runtime/build/outputs/androidTest-results/**
            data/build/device-evidence/**
            data/build/reports/**
            data/build/outputs/androidTest-results/**
  required-checks:
    runs-on: ubuntu-24.04
    if: always()
    needs: [build-checks, source-runtime-devices]
    steps:
      - name: Require build and both Android device gates
        env:
          BUILD_RESULT: ${{ needs.build-checks.result }}
          DEVICE_RESULT: ${{ needs.source-runtime-devices.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
