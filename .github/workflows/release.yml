name: Release
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan release for current branch tip
        id: plan
        run: |
          tip=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            python3 scripts/release-plan.py
          fi
      - name: Reserve or resume immutable tag
        if: steps.plan.outputs.tag != ''
        id: reserve
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{}")" = "$GITHUB_SHA"
            if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
              exit 0
            fi
          else
            git push origin "$GITHUB_SHA:refs/tags/$TAG"
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.reserve.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Build universal release APK
        if: steps.reserve.outputs.build == 'true'
        env:
          SLOT: ${{ steps.plan.outputs.slot }}
        run: |
          python3 scripts/setup_android_ci.py
          python3 scripts/verify_wrapper.py
          ./gradlew :app:assembleRelease -PluxReleaseSlot="$SLOT" --console=plain
      - name: Sign and verify APK
        if: steps.reserve.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CODE: ${{ steps.plan.outputs.code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/sign-release.sh
      - name: Attach verified assets and publish development release
        if: steps.reserve.outputs.build == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          CODE: ${{ steps.plan.outputs.code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            exit 0
          fi
          {
            echo "源码提交：$GITHUB_SHA"
            echo "Android versionCode：$CODE；ABI：arm64-v8a、armeabi-v7a。"
            echo "签名和完整性已校验，APK 的 SHA-256 见 SHA256SUMS.txt。"
            echo "阶段功能与已知缺口见[该提交的路线图](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/ROADMAP.md)。"
          } > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
            if [[ "$GITHUB_REF_NAME" == dev ]]; then flags+=(--prerelease --latest=false); fi
            gh release create "$TAG" "${flags[@]}"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" "dist/lux-music-android-$VERSION.apk" dist/SHA256SUMS.txt --clobber
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
