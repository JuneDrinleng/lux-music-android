*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--inset);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
/* frame */
.stage{min-height:100vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:36px;padding:24px}
.device{width:390px;height:844px;flex:none;border-radius:52px;padding:11px;background:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.28)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--page);isolation:isolate;font-size:15px;line-height:20px}
.legend{width:270px;font-size:13px;line-height:1.6;color:var(--muted)}
.legend b{display:block;font-size:22px;line-height:28px;color:var(--ink);margin-bottom:6px}
.legend small{display:block;margin-top:10px}
@media (max-width:500px){.stage{display:block;padding:0;min-height:0}.device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0}.legend{display:none}}
.statusbar{position:absolute;left:0;right:0;top:0;height:var(--sb);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;font-weight:600;pointer-events:none;color:var(--ink)}
.statusbar i{width:18px;height:9px;border-radius:3px;border:1.5px solid currentColor;display:inline-block}
/* layers */
.view{position:absolute;inset:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:calc(var(--sb) + 8px) var(--g) var(--dock-space)}
.scroll::-webkit-scrollbar,.pg-scroll::-webkit-scrollbar,.pl-scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.stack{position:absolute;inset:0;z-index:30;background:var(--page);transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.stack.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.page{position:absolute;inset:0;display:flex;flex-direction:column}
.pg-top{flex:none;display:flex;align-items:center;gap:4px;height:52px;margin-top:var(--sb);padding:0 8px}
.pg-title{flex:1;text-align:center;font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-sp{width:44px;flex:none}
.pg-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:4px var(--g) var(--dock-space)}
.pg-pad{padding-top:4px}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:28;pointer-events:none}
.dock>*{pointer-events:auto}
.player{position:absolute;inset:0;z-index:50;background:var(--page);transform:translateY(100%);visibility:hidden;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.33,1,.68,1),visibility 0s .3s}
.player.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.25,1.1,.4,1)}
.scrim{position:absolute;inset:0;z-index:54;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.qsheet{position:absolute;left:0;right:0;bottom:0;z-index:55;max-height:72%;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--e2);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.qsheet.open{transform:none}
.toast{position:absolute;left:50%;bottom:150px;z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--inverse);color:var(--on-inverse);padding:10px 18px;border-radius:var(--r-full);font-size:13px;white-space:nowrap;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* type */
.large-title{font-size:34px;line-height:41px;font-weight:700;color:var(--ink)}
.title2{font-size:22px;line-height:28px;font-weight:700}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 10px}
.sec-h b{font-size:20px;line-height:25px;font-weight:600}
.sec-h .link{font-size:15px;font-weight:600;color:var(--accent-ink);display:inline-flex;align-items:center;min-height:32px}
.sec-h .link .ic{width:18px;height:18px}
.kicker{font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}
/* covers */
.cover{display:block;overflow:hidden;background:var(--inset);flex:none;border-radius:var(--r-sm);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.xs{width:36px;height:36px}.cover.sm{width:44px;height:44px}.cover.md{width:56px;height:56px}.cover.hero{width:132px;height:132px;border-radius:var(--r-block);box-shadow:var(--e1)}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
/* surfaces */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--e1)}
.grp-wrap{margin-top:22px}
.grp-h{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--muted);margin:0 0 8px 16px}
.grp{background:var(--card);border-radius:var(--r-block);box-shadow:var(--e1);overflow:hidden}
.grp>*+*{box-shadow:inset 0 1px 0 var(--sep)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;width:100%;text-align:left}
.row-t{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-v{font-size:15px;color:var(--muted);white-space:nowrap}
.row .chev{width:18px;height:18px;color:var(--faint)}
.optrow.on .row-t{color:var(--accent-ink)}.optrow .ic{color:var(--accent-ink)}
.iblock{width:32px;height:32px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:flex;align-items:center;justify-content:center;flex:none}
.iblock .ic{width:18px;height:18px}
.srow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;width:100%;text-align:left}
.srow-t{flex:1;min-width:0;display:flex;flex-direction:column}
.srow-t b,.mini-t b{font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-t small,.mini-t small{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.cur .srow-t b{color:var(--accent-ink)}
.srow .eq{color:var(--accent)}
.dur{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.rank{width:22px;flex:none;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px;line-height:21px}
/* controls */
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;color:var(--ink)}
.iconbtn.big .ic{width:32px;height:32px}
.btn{height:44px;padding:0 18px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;white-space:nowrap}
.btn .ic{width:20px;height:20px}
.btn.primary{background:var(--accent-ink);color:var(--on-accent)}
.btn.tonal{background:var(--pc);color:var(--on-pc)}
.btn.plain{background:var(--card);color:var(--accent-ink);box-shadow:var(--e1)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.sm .ic{width:16px;height:16px}
.seg{display:flex;height:44px;padding:4px;border-radius:var(--r-full);background:var(--card);box-shadow:var(--e1);gap:2px}
.seg button{flex:1;border-radius:var(--r-full);font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;padding:0 8px;transition:background .2s,color .2s}
.seg button.on{background:var(--accent-ink);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 14px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--card);color:var(--ink);box-shadow:var(--e1);white-space:nowrap}
.chip .ic{width:16px;height:16px;color:var(--faint)}
.chip.on{background:var(--accent-ink);color:var(--on-accent)}.chip.on .ic{color:var(--on-accent)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--g));padding:4px var(--g) 14px;scroll-snap-type:x mandatory;scroll-padding:0 var(--g)}
.hscroll>*{scroll-snap-align:start;flex:none}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .3s}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .3s cubic-bezier(.34,1.56,.64,1)}
.switch.on{background:var(--accent)}.switch.on i{left:24px}
.pbtn{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);clip-path:var(--fc-circle);transition:clip-path .45s cubic-bezier(.34,1.56,.64,1)}
.pbtn[aria-label="暂停"]{clip-path:var(--fc-cookie)}
.pbtn .ic{width:26px;height:26px}
.pbtn.sm{width:40px;height:40px}.pbtn.sm .ic{width:22px;height:22px}
.pbtn.lg{width:68px;height:68px}.pbtn.lg .ic{width:34px;height:34px}
.likebtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.likebtn.on{color:var(--accent)}
.tgl{height:30px;min-width:44px;padding:0 12px;border-radius:var(--r-full);font-size:13px;font-weight:700;background:var(--inset);color:var(--ink)}
.tgl.on{background:var(--accent-ink);color:var(--on-accent)}
.tgl[aria-disabled="true"]{opacity:.5}
.sfield{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:var(--r-full);background:var(--card);box-shadow:var(--e1);color:var(--muted)}
.sfield input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)}
.sfield input::placeholder{color:var(--faint)}
.src-seg{margin:14px 0 4px}
.s-sec{margin-top:18px}.s-h{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 4px}
.sugg .ic{width:18px;height:18px;color:var(--faint)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
/* detail page */
.detail-hero{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.dh-t{min-width:0}.dh-t h2{font-size:24px;line-height:30px;font-weight:700;margin:2px 0 4px}.dh-t p{font-size:13px;color:var(--muted)}
.detail-acts{display:flex;gap:10px;margin-bottom:16px}.detail-acts .btn{flex:1}
/* player primitives */
.seek{position:relative;height:28px;cursor:pointer;touch-action:none}
.seek .tr{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--inset);overflow:hidden}
.seek .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.seek .th{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.22)}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.lp{display:flex;align-items:flex-end;gap:10px}
.lp-lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.lp-c{font-size:18px;line-height:26px;font-weight:700;color:var(--ink)}
.lp-x{font-size:14px;line-height:20px;color:var(--muted)}
.lp-n{font-size:14px;line-height:20px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-acts,.lyr-tgls{display:flex;gap:6px;flex:none}
.lyrics{display:flex;flex-direction:column;gap:6px;padding:8px 0 40px}
.lyrics.empty{color:var(--muted);padding:40px 0;text-align:center}
.lline{display:flex;flex-direction:column;gap:2px;text-align:left;padding:6px 0}
.lline .tx{font-size:20px;line-height:28px;font-weight:600;color:var(--muted)}
.lline.past .tx{color:var(--faint)}
.lline.act .tx{font-size:24px;line-height:32px;font-weight:700;color:var(--ink)}
.lline .ex{font-size:14px;line-height:20px;color:var(--muted)}
.comments .cm-head{display:flex;align-items:baseline;gap:8px;margin:4px 0 6px}.cm-head b{font-size:20px;line-height:25px}.cm-head small{font-size:13px;color:var(--muted)}
.cm{display:flex;gap:10px;padding:12px 0;box-shadow:inset 0 -1px 0 var(--sep)}
.cm .avatar{width:32px;height:32px;font-size:13px}
.cb{flex:1;min-width:0}.cn{font-size:13px;font-weight:700}.ctime{font-size:12px;color:var(--faint)}.cb p{font-size:15px;line-height:22px;margin-top:4px}
.cmlike{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--faint);align-self:flex-start;min-height:32px}
.cmlike .ic{width:16px;height:16px}.cmlike.on{color:var(--accent-ink)}
/* mini player */
.mini{position:relative;display:flex;align-items:center;gap:6px;height:60px;padding:0 6px 0 8px;background:var(--card);border-radius:var(--r-block);box-shadow:var(--e1);overflow:hidden}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%;text-align:left}
.mini-t{flex:1;min-width:0;display:flex;flex-direction:column}
.mini-prog{position:absolute;left:16px;right:16px;bottom:4px;height:2px;border-radius:1px;background:var(--inset);overflow:hidden}
.mini-prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
/* queue */
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.q-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;flex:none}
.q-head>div{flex:1;min-width:0}.q-head b{display:block;font-size:20px;line-height:25px}.q-head small{font-size:13px;color:var(--muted)}

<style id="lux-carousel-seam-fix">
/* Carousel surface blending: preserve dimensions, card sizes and scrolling behavior. */
.hscroll.ne-boards,
.hscroll.ne-pls,
.hscroll:has(.ne-board){
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  /* Extend the paint area so neumorphic glows fade rather than hit a hard clip. */
  padding-top:22px !important;
  padding-bottom:30px !important;
  margin-top:-18px !important;
  margin-bottom:-16px !important;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 19%,#000 79%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 19%,#000 79%,transparent 100%);
}
/* Reduce white halos specifically on horizontally scrolling cards. */
.hscroll .ne-board,
.hscroll .card{
  background:var(--page) !important;
  border:1px solid rgba(255,255,255,.42) !important;
  box-shadow:-5px -5px 13px rgba(255,255,255,.58),6px 7px 17px rgba(173,154,150,.22) !important;
}
/* Keep the underlying page continuous, with no strip-specific white fill. */
.scroll,.view{background:transparent}
</style>

  border:1px solid rgba(120,101,103,.055) !important;

.hscroll,.hscroll.ne-boards,.hscroll.ne-pls{background:transparent !important;}

  background:rgba(241,238,233,.16) !important;

    if (p.t === 'list') return richList(p.key);
    if (p.t === 'account') return accountPage();
    if (p.t === 'stats') return statsPage();
    if (p.t === 'together') return togetherPage();
    if (p.t === 'cache') return cachePage();
    if (p.t === 'sync') return syncPage();
    if (p.t === 'version') return versionPage();
    if (p.t === 'fx') return fxPage();
    if (p.t === 'customSrc') return customSrcPage();
    if (p.t === 'room') return roomPage();
    if (p.t === 'conflict') return conflictPage();
    if (p.t === 'export') return exportPage();
    if (p.t === 'import') return importPage();
    if (p.t === 'github') return githubPage();
    if (p.t === 'newPl') return newPlPage();
    if (p.t === 'smartPl') return smartPage();
    if (p.t === 'rename') return renamePage(p.id);
    if (p.t === 'deletePl') return deletePage(p.id);
    if (p.t === 'addTo') return addToPage();
    return '';
  }

  /* ---------- player: NetEase chrome + Lux extras ---------- */
  function vinyl(s) {
    return '<div class="ne-stage"><i class="ne-arm' + (S.playing ? ' on' : '') + '"></i><button class="vinyl' + (S.playing ? ' spin' : '') + '" data-act="showLyrics" aria-label="查看歌词"><i class="ne-groove"></i>' + cov(s.cover, 'ne-disc-cv') + '</button></div>';
  }
  function ptop(s, back) {
    return '<div class="ne-ptop"><button class="iconbtn" data-act="' + (back || 'closePlay') + '" aria-label="' + (back === 'showPlay' ? '返回' : '收起') + '">' + ic(back === 'showPlay' ? 'chevLeft' : 'chevDown') + '</button>' +
      '<span class="ne-pt"><b>' + esc(s.title) + '</b><small class="lx-from">正在播放 · 来自「' + esc(S.fromName) + '」</small></span>' +
      '<button class="iconbtn" data-act="stub" data-msg="分享（预览中不执行）" aria-label="分享">' + ic('share') + '</button></div>';
  }
  function moreSheet() {
    if (S.ui.moreOpen !== '1') return '';
    return '<div class="lx-psheet" role="dialog" aria-label="更多"><p class="kicker">定时关闭</p><div class="chips">' +
      ['', '15 分', '30 分', '45 分', '60 分'].map(function (x) { return '<button class="chip' + (S.ui.sleep === x ? ' on' : '') + '" data-act="setSleep" data-v="' + x + '">' + (x || '关闭') + '</button>'; }).join('') +
      '</div><div class="lx-moreacts"><button class="row" data-act="stub" data-msg="分享（预览中不执行）">' + ic('share') + '<span class="row-t">分享</span></button>' +
      '<button class="row" data-act="stub" data-msg="下载（预览中不执行）">' + ic('download') + '<span class="row-t">下载</span></button></div></div>';
  }
  function cmItem(c, key) {
    var on = !!S.cmLiked[key];
    return '<div class="cm" data-time="' + esc(c[1]) + '"><span class="avatar">' + esc(c[0].slice(0, 1)) + '</span><div class="cb"><div class="cn">' + esc(c[0]) + '</div><div class="ctime">' + esc(c[1]) + '</div><p>' + esc(c[2]) + '</p></div>' +
      '<button class="cmlike' + (on ? ' on' : '') + '" data-act="cmLike" data-i="' + key + '" aria-pressed="' + on + '" aria-label="点赞">' + ic(on ? 'thumbOn' : 'thumb') + '<span>' + (c[3] + (on ? 1 : 0)) + '</span></button></div>';
  }
  function commentsView() {
    var s = C.cur(), sort = S.ui.cmSort, items;
    if (sort === 'new') items = NEW_CM.map(function (c, i) { return [c, 'n' + i]; }).concat(C.COMMENTS.map(function (c, i) { return [c, i]; }));
    else items = C.COMMENTS.map(function (c, i) { return [c, i]; }).sort(function (a, b) { return b[0][3] - a[0][3]; });
    return ptop(s, 'showPlay') + '<div class="ne-cmsort seg" role="tablist" aria-label="评论排序">' +
      [['hot', '热门'], ['new', '最新']].map(function (x) { return '<button role="tab" class="' + (sort === x[0] ? 'on' : '') + '" data-act="set" data-k="cmSort" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
      '</div><div class="pl-scroll ne-cm"><div class="comments" data-cmsort="' + sort + '"><div class="cm-head"><b>' + (sort === 'new' ? '最新评论' : '热门评论') + '</b><small>' + (C.COMMENTS.length + 2380) + ' 条 · ' + esc(s.title) + '</small></div>' + items.map(function (x) { return cmItem(x[0], x[1]); }).join('') + '</div></div>';
  }
  function lyricsView() {
    var s = C.cur(), L = C.lyr(), k = C.lineAt(L, S.t), t = L[k] ? C.fmt(L[k].t) : '0:00';
    return ptop(s, 'showPlay') + '<div class="ne-lyrbar">' + C.lyrToggles() + '<button class="btn plain sm" data-act="showPlay">' + ic('album') + '黑胶</button></div>' +
      (S.pvRo && !hasRo() ? '<p class="lx-nora" data-nora>本曲暂无音译</p>' : '') +
      '<div class="pl-scroll ne-lyr">' + C.lyricsHTML('ne-lines') + '<p class="lx-seekhint">从 ' + t + ' 播放</p></div>' +
      '<div class="ne-pfoot">' + C.seekHTML() + C.ctrlHTML() + '</div>';
  }
  function player() {
    var s = C.cur();
    if (S.pv === 'lyric') return lyricsView();
    if (S.pv === 'comment') return commentsView();
    return ptop(s) + moreSheet() +
      '<div class="pl-scroll ne-pbody">' + vinyl(s) +
      '<div class="ne-lpwrap">' + C.lpHTML() + (S.pvRo && !hasRo() ? '<p class="lx-nora" data-nora>本曲暂无音译</p>' : '') + '</div></div>' +
      '<div class="ne-acts">' + C.likeBtn() +
      '<button class="iconbtn ne-cmbtn" data-act="showComments" aria-label="评论 2385">' + ic('comment') + '<i>2385</i></button>' +
      '<button class="iconbtn" data-act="set" data-k="moreOpen" data-v="' + (S.ui.moreOpen === '1' ? '' : '1') + '" aria-label="更多">' + ic('dots') + '</button></div>' +
      '<div class="ne-pfoot">' + C.seekHTML() + C.ctrlHTML() + '</div>';
  }
  function queue() {
    return '<div class="grab"></div><div class="q-head lx-qhead"><div><b>播放队列 · 正在播放 ' + (S.qi + 1) + '</b><small>' + esc(S.fromName) + ' · ' + S.queue.length + ' 首</small></div>' +
      '<button class="btn tonal sm" data-act="clearQ" aria-label="清空当前播放列表">' + ic('broom') + '清空</button><button class="iconbtn" data-act="closeQueue" aria-label="关闭">' + ic('close') + '</button></div>' +
      '<div class="q-list">' + S.queue.map(function (id, i) { var s = C.SONG[id]; return '<button class="qrow' + (i === S.qi ? ' cur' : '') + '" data-act="qplay" data-i="' + i + '">' + cov(s.cover, 'xs') + '<span class="srow-t"><b>' + esc(s.title) + '</b><small>' + esc(s.artist) + '</small></span>' + (i === S.qi ? ic('equalizer') : '<span class="dur">' + C.fmt(s.dur) + '</span>') + '</button>'; }).join('') + '</div>';
  }
  function startRadio() {
    var ids = C.list('radio').ids; C.play(ids, 0, '无尽电台');
  }

  C.register({
    id: 'netease-lux',
    tabs: [
      { id: 'home', label: '推荐', icon: 'home', iconOn: 'homeOn' },
      { id: 'discover', label: '发现', icon: 'compass', iconOn: 'compassOn' },
      { id: 'roam', label: '电台', icon: 'radio', iconOn: 'radioOn' },
      { id: 'library', label: '我的', icon: 'account', iconOn: 'accountOn' }
    ],
    tab: function (id) {
      var old = document.querySelector('#view .scroll');
      if (old && old.getAttribute('data-tabview')) TABSCROLL[old.getAttribute('data-tabview')] = old.scrollTop || 0;
      return { home: home, discover: discover, roam: roam, library: mine }[id]();
    },
    dock: function () {
      return (S.tab === 2 ? '' : '<i class="dock-fade"></i><div class="ne-mini">' + C.miniHTML('ne-minicard') + '</div>') +
        '<nav class="ne-tabs" role="tablist" aria-label="主导航">' + C.navBtns(true) + '</nav>';
    },
    player: player,
    page: page,
    queue: queue,
    searchBody: searchBody,
    onInput: function (t) {
      var k = t.getAttribute('data-input');
      if (k === 'setQ') { S.ui.setQ = t.value; var box = document.getElementById('setrows'); if (box) box.innerHTML = settingsGroups(); }
      if (k === 'plName') S.ui.plName = t.value;
    },
    after: function () {
      var sc = document.getElementById('screen'); if (!sc) return;
      var fix = function () { if (sc.scrollTop) sc.scrollTop = 0; if (sc.scrollLeft) sc.scrollLeft = 0; };
      fix();
      var tv = document.querySelector('#view .scroll'), tid = tv && tv.getAttribute('data-tabview');
      if (tv && tid !== lastTabId) { tv.scrollTop = TABSCROLL[tid] || 0; lastTabId = tid; }
      if (!sc.__lxGuard && sc.addEventListener) { sc.__lxGuard = true; sc.addEventListener('scroll', fix); }
      if (window.requestAnimationFrame) window.requestAnimationFrame(fix);
    },
    act: {
      nav: function (el) {
        var i = Number(el.getAttribute('data-i'));
        if (i === S.tab && !S.stack.length) {
          var sc = document.getElementById('screen'); if (sc) { sc.scrollTop = 0; sc.scrollLeft = 0; }
          var tv = document.querySelector('#view .scroll'); TABSCROLL[el.getAttribute('data-tab')] = 0;
          if (tv) { if (tv.scrollTo) tv.scrollTo({ top: 0, behavior: 'smooth' }); tv.scrollTop = 0; }
          return;
        }
        S.tab = i; S.stack = []; C.render();
      },
      back: function () { S.stack.pop(); C.render(); },
      openList: function (el) { push({ t: 'list', key: el.getAttribute('data-list') }); },
      goDiscover: function () { S.tab = 1; S.stack = []; C.render(); },
      goRadio: function () { S.tab = 2; S.stack = []; if (S.fromName !== '无尽电台') { var ids = C.list('radio').ids; S.queue = ids.slice(); S.qi = 0; S.fromName = '无尽电台'; S.t = 0; S.playing = true; } C.render(); },
      startRadio: function () { startRadio(); },
      openPage: function (el) { push({ t: el.getAttribute('data-t'), id: el.getAttribute('data-id') || '' }); },
      clearHist: function () { S.history = []; C.render(); },
      delWord: function (el) { var w = el.getAttribute('data-w'); S.history = S.history.filter(function (x) { return x !== w; }); C.render(); },
      pickSort: function (el) { S.ui.plSort = el.getAttribute('data-v'); S.ui.sortOpen = ''; C.render(); },
      setNick: function (el) { S.nick = el.getAttribute('data-v'); toast('昵称已改为 ' + S.nick + '（仅预览）'); C.render(); },
      doLogin: function () { S.ui.syncOn = true; toast('已切换为示例「已连接」状态'); C.render(); },
      checkUpdate: function () { S.ui.verModal = '1'; C.render(); },
      setSleep: function (el) { S.ui.sleep = el.getAttribute('data-v'); S.ui.moreOpen = ''; toast(S.ui.sleep ? ('将在 ' + S.ui.sleep + ' 后停止（预览）') : '已关闭定时'); C.render(); },
      addTo: function (el) { S.ui.addId = el.getAttribute('data-id') || C.cur().id; push({ t: 'addTo' }); },
      doAdd: function (el) {
        var pl = S.playlists.filter(function (p) { return p.id === el.getAttribute('data-id'); })[0];
        if (pl && pl.songs.indexOf(S.ui.addId) < 0) pl.songs.push(S.ui.addId);
        toast('已加入「' + (pl ? pl.name : '') + '」（预览）'); S.stack.pop(); C.render();
      },
      makePl: function () { var name = (S.ui.plName || '').trim() || '新建歌单'; S.playlists.push({ id: 'p_new_' + Date.now(), name: name, cover: 'c2', songs: [] }); S.ui.plName = ''; toast('已创建「' + name + '」'); S.stack.pop(); C.render(); },
      makeSmart: function () {
        var name = S.ui.smartName || '智能收藏', key = S.ui.smartRules || 'liked';
        var ids = key === 'liked' ? C.likedIds() : key === 'history' ? C.RECENT.slice() : key === 'local' ? C.LOCAL.slice() : C.DAILY.slice();
        S.playlists.push({ id: 'p_smart_' + Date.now(), name: name, cover: 'c8', songs: ids.slice(0, 8) });
        toast('已创建智能歌单「' + name + '」'); S.stack.pop(); C.render();
      },
      doRename: function (el) { var pl = S.playlists.filter(function (p) { return p.id === el.getAttribute('data-id'); })[0]; if (pl) pl.name = (S.ui.plName || '').trim() || pl.name; toast('已重命名为「' + (pl && pl.name) + '」'); S.stack.pop(); C.render(); },
      doDelete: function (el) { S.playlists = S.playlists.filter(function (p) { return p.id !== el.getAttribute('data-id'); }); toast('已删除歌单（预览）'); S.stack = []; C.render(); },
      clearQ: function () { S.queue = [S.queue[S.qi]]; S.qi = 0; toast('已清空，仅保留当前歌曲'); C.render(); },
      searchSrc: function (el) { S.qSrc = el.getAttribute('data-id'); S.ui.srcMenu = ''; C.render(); }
    }
  });
})();
</script>
<script>window.LuxCore.start();</script>
</body></html>
